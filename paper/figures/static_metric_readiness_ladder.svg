<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1f2933}.small{font-size:12px;fill:#52606d}.title{font-size:22px;font-weight:700}.box{fill:#f5f7fa;stroke:#bcccdc;stroke-width:1.5}.ready{fill:#e3fcef;stroke:#2f9e44}.warn{fill:#fff8e1;stroke:#f2a900}.future{fill:#e7f0ff;stroke:#2f80ed}</style>
<text x="28" y="34" class="title">Static metric ringdown-readiness ladder</text>
<text x="28" y="56" class="small">A line element alone is not a gravitational ringdown model.</text>
<rect x="28" y="72" width="190" height="115" rx="6" class="box"/>
<text x="40" y="98" font-weight="700">Metric/geodesic only</text>
<text x="40" y="124" class="small">horizon, photon sphere,</text>
<text x="40" y="142" class="small">ISCO, QPO, shadow</text>
<line x1="223" y1="130" x2="235" y2="130" stroke="#52606d" stroke-width="1.6"/>
<polygon points="235,125 235,135 243,130" fill="#52606d"/>
<rect x="240" y="72" width="190" height="115" rx="6" class="box"/>
<text x="252" y="98" font-weight="700">Test-field QNM</text>
<text x="252" y="124" class="small">scalar or</text>
<text x="252" y="142" class="small">electromagnetic fields</text>
<text x="252" y="160" class="small">on fixed background</text>
<line x1="435" y1="130" x2="447" y2="130" stroke="#52606d" stroke-width="1.6"/>
<polygon points="447,125 447,135 455,130" fill="#52606d"/>
<rect x="452" y="72" width="190" height="115" rx="6" class="box warn"/>
<text x="464" y="98" font-weight="700">Supplied master potential</text>
<text x="464" y="124" class="small">axial/polar</text>
<text x="464" y="142" class="small">gravitational potential</text>
<text x="464" y="160" class="small">and boundary conditions</text>
<line x1="647" y1="130" x2="659" y2="130" stroke="#52606d" stroke-width="1.6"/>
<polygon points="659,125 659,135 667,130" fill="#52606d"/>
<rect x="664" y="72" width="190" height="115" rx="6" class="box ready"/>
<text x="676" y="98" font-weight="700">Validated static QNM</text>
<text x="676" y="124" class="small">local solver reproduces</text>
<text x="676" y="142" class="small">published spectra below</text>
<text x="676" y="160" class="small">target error</text>
<line x1="859" y1="130" x2="871" y2="130" stroke="#52606d" stroke-width="1.6"/>
<polygon points="871,125 871,135 879,130" fill="#52606d"/>
<rect x="876" y="72" width="190" height="115" rx="6" class="box future"/>
<text x="888" y="98" font-weight="700">Theory-backed rotating QNM</text>
<text x="888" y="124" class="small">action, perturbations,</text>
<text x="888" y="142" class="small">Kerr limit, mode fits</text>
<text x="888" y="160" class="small">for event projection</text>
</svg>